services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aippt}
      MYSQL_USER: aippt
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aippt}
      MYSQL_DATABASE: aippt
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uaippt -paippt --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+aiomysql://aippt:${MYSQL_PASSWORD:-aippt}@mysql:3306/aippt?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./shared:/shared:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    command: ["uv", "run", "arq", "app.worker.settings.WorkerSettings"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+aiomysql://aippt:${MYSQL_PASSWORD:-aippt}@mysql:3306/aippt?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./shared:/shared:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    image: nginx:alpine
    ports:
      - "39880:80"
    volumes:
      - ./frontend-vue/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mysql_data:
